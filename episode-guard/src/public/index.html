<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episode Guard</title>
  <style>
    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3d;
      --text:     #e2e4ed;
      --muted:    #6b7080;
      --accent:   #6c63ff;
      --green:    #22c55e;
      --yellow:   #f59e0b;
      --red:      #ef4444;
      --blue:     #3b82f6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }

    /* Layout */
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 24px; height: 56px; }
    header h1 { font-size: 16px; font-weight: 700; letter-spacing: .5px; color: var(--text); }
    header h1 span { color: var(--accent); }
    nav { display: flex; gap: 4px; }
    nav button { background: none; border: none; color: var(--muted); font-size: 13px; padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: background .15s, color .15s; }
    nav button:hover { background: var(--border); color: var(--text); }
    nav button.active { background: var(--accent); color: #fff; }
    .status-bar { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 16px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
    .status-dot.error { background: var(--red); }
    main { padding: 24px; flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; }

    /* Views */
    .view { display: none; }
    .view.active { display: block; }

    /* Section titles */
    .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }

    /* Cards grid */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 28px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; }
    .card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
    .card .big { font-size: 32px; font-weight: 700; line-height: 1; }
    .card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .card .sub span { color: var(--green); }

    /* Now playing */
    .now-playing { margin-bottom: 28px; }
    .playing-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
    .playing-badge { background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .5px; flex-shrink: 0; }
    .playing-title { font-weight: 600; }
    .playing-ep { color: var(--muted); font-size: 13px; }
    .empty-state { color: var(--muted); padding: 16px 0; font-size: 13px; }

    /* Activity log */
    .activity { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .activity table { width: 100%; border-collapse: collapse; }
    .activity th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    .activity td { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .activity tr:last-child td { border-bottom: none; }
    .activity tr:hover td { background: rgba(255,255,255,.02); }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
    .badge-show_added      { background: rgba(108,99,255,.2); color: var(--accent); }
    .badge-episode_grabbed { background: rgba(34,197,94,.2);  color: var(--green); }
    .badge-season_monitored{ background: rgba(59,130,246,.2); color: var(--blue); }
    .badge-error           { background: rgba(239,68,68,.2);  color: var(--red); }
    .badge-episode_skipped { background: rgba(107,112,128,.2);color: var(--muted); }

    /* Settings */
    .settings-form { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; max-width: 560px; }
    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .field .hint { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 14px; padding: 8px 12px; outline: none; transition: border-color .15s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field select option { background: var(--bg); }
    .save-btn {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 9px 22px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .save-btn:hover { opacity: .85; }
    .save-btn:disabled { opacity: .4; cursor: default; }
    .toast { margin-top: 14px; font-size: 13px; padding: 8px 14px; border-radius: 6px; display: none; }
    .toast.success { background: rgba(34,197,94,.15); color: var(--green); }
    .toast.error   { background: rgba(239,68,68,.15);  color: var(--red); }

    /* Sections */
    .section { margin-bottom: 32px; }

    /* Scrollable activity */
    .activity-wrap { max-height: 480px; overflow-y: auto; border-radius: 10px; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>Episode<span>Guard</span></h1>
    <nav>
      <button class="active" onclick="showView('dashboard', this)">Dashboard</button>
      <button onclick="showView('settings', this)">Settings</button>
    </nav>
    <div class="status-bar">
      <span id="poll-status">Loading…</span>
      <span class="status-dot" id="status-dot"></span>
    </div>
  </header>

  <main>

    <!-- DASHBOARD VIEW -->
    <div id="view-dashboard" class="view active">

      <div class="section">
        <div class="section-title">Now Playing</div>
        <div id="now-playing-list"><div class="empty-state">Loading…</div></div>
      </div>

      <div class="section">
        <div class="section-title">All Time</div>
        <div class="cards" id="cards-alltime"></div>
      </div>

      <div class="section">
        <div class="section-title">Last 7 Days</div>
        <div class="cards" id="cards-7d"></div>
      </div>

      <div class="section">
        <div class="section-title">Recent Activity</div>
        <div class="activity-wrap activity">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Event</th>
                <th>Show</th>
                <th>Episode</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody id="activity-body">
              <tr><td colspan="5" style="color:var(--muted);padding:16px">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- SETTINGS VIEW -->
    <div id="view-settings" class="view">
      <div class="section-title" style="margin-bottom:20px">Configuration</div>
      <div class="settings-form">
        <div class="field">
          <label>Poll Interval (seconds)</label>
          <div class="hint">How often to check Tautulli for active sessions.</div>
          <input type="number" id="s-poll" min="10" step="10">
        </div>
        <div class="field">
          <label>Lookahead Episodes</label>
          <div class="hint">Number of upcoming episodes to ensure are ready.</div>
          <input type="number" id="s-lookahead" min="1" max="50">
        </div>
        <div class="field">
          <label>Season End Buffer</label>
          <div class="hint">Episodes from finale to trigger next-season pre-monitor.</div>
          <input type="number" id="s-buffer" min="1" max="20">
        </div>
        <button class="save-btn" id="save-btn" onclick="saveSettings()">Save Settings</button>
        <div class="toast" id="toast"></div>
      </div>
    </div>

  </main>
</div>

<script>
  const EVENT_LABELS = {
    show_added:       'Show Added',
    episode_grabbed:  'Episodes Grabbed',
    season_monitored: 'Season Monitored',
    episode_skipped:  'On Disk',
    error:            'Error',
  };

  function showView(name, btn) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    btn.classList.add('active');
    if (name === 'settings') loadSettings();
  }

  function relativeTime(iso) {
    if (!iso) return '—';
    const diff = Math.round((Date.now() - new Date(iso)) / 1000);
    if (diff < 5)   return 'just now';
    if (diff < 60)  return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    return new Date(iso).toLocaleString();
  }

  function countdownTo(iso) {
    if (!iso) return '';
    const diff = Math.round((new Date(iso) - Date.now()) / 1000);
    if (diff <= 0) return 'now';
    if (diff < 60) return `in ${diff}s`;
    return `in ${Math.floor(diff / 60)}m ${diff % 60}s`;
  }

  function epLabel(season, episode) {
    if (season == null) return '—';
    const s = String(season).padStart(2, '0');
    const e = String(episode ?? 0).padStart(2, '0');
    return `S${s}E${e}`;
  }

  function statCard(label, value, sub) {
    return `<div class="card">
      <div class="label">${label}</div>
      <div class="big">${value ?? 0}</div>
      ${sub ? `<div class="sub">${sub}</div>` : ''}
    </div>`;
  }

  async function loadDashboard() {
    try {
      const res = await fetch('/api/dashboard');
      const data = await res.json();

      // Status bar
      const { lastPollAt, nextPollAt, lastError } = data.status;
      const dot = document.getElementById('status-dot');
      dot.className = 'status-dot' + (lastError ? ' error' : '');
      document.getElementById('poll-status').textContent =
        `Last poll: ${relativeTime(lastPollAt)} · Next: ${countdownTo(nextPollAt)}` +
        (lastError ? ` · Error: ${lastError}` : '');

      // Now playing
      const np = document.getElementById('now-playing-list');
      if (data.nowPlaying.length === 0) {
        np.innerHTML = '<div class="empty-state">Nothing playing right now.</div>';
      } else {
        np.innerHTML = data.nowPlaying.map(ep => `
          <div class="playing-card">
            <span class="playing-badge">LIVE</span>
            <div>
              <div class="playing-title">${esc(ep.showTitle)}</div>
              <div class="playing-ep">${epLabel(ep.season, ep.episode)}</div>
            </div>
          </div>
        `).join('');
      }

      // Stats
      const { allTime, last7d } = data.stats;
      document.getElementById('cards-alltime').innerHTML =
        statCard('Shows Added',       allTime.shows_added) +
        statCard('Episodes Grabbed',  allTime.episodes_grabbed) +
        statCard('Seasons Monitored', allTime.seasons_monitored);

      document.getElementById('cards-7d').innerHTML =
        statCard('Shows Added',       last7d.shows_added) +
        statCard('Episodes Grabbed',  last7d.episodes_grabbed) +
        statCard('Seasons Monitored', last7d.seasons_monitored);

      // Activity log
      const tbody = document.getElementById('activity-body');
      if (!data.activity.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted);padding:16px">No activity yet.</td></tr>';
      } else {
        tbody.innerHTML = data.activity.map(row => {
          const details = row.details ? JSON.parse(row.details) : {};
          let detailText = '';
          if (row.episode_count > 1) detailText = `×${row.episode_count}`;
          else if (details.reason) detailText = details.reason.replace(/_/g, ' ');
          else if (details.message) detailText = esc(details.message.slice(0, 60));
          return `<tr>
            <td style="color:var(--muted);white-space:nowrap">${relativeTime(row.timestamp)}</td>
            <td><span class="badge badge-${row.event_type}">${EVENT_LABELS[row.event_type] ?? row.event_type}</span></td>
            <td>${esc(row.show_title ?? '—')}</td>
            <td>${epLabel(row.season, row.episode)}</td>
            <td style="color:var(--muted)">${detailText}</td>
          </tr>`;
        }).join('');
      }
    } catch (err) {
      console.error('Dashboard load failed:', err);
    }
  }

  async function loadSettings() {
    const res = await fetch('/api/settings');
    const s = await res.json();
    document.getElementById('s-poll').value      = s.poll_interval_seconds;
    document.getElementById('s-lookahead').value = s.lookahead_episodes;
    document.getElementById('s-buffer').value    = s.season_end_buffer;
  }

  async function saveSettings() {
    const btn   = document.getElementById('save-btn');
    const toast = document.getElementById('toast');
    btn.disabled = true;

    const payload = {
      poll_interval_seconds: document.getElementById('s-poll').value,
      lookahead_episodes:    document.getElementById('s-lookahead').value,
      season_end_buffer:     document.getElementById('s-buffer').value,
    };

    try {
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (res.ok) {
        showToast('Settings saved. Watcher restarted with new interval.', 'success');
      } else {
        showToast(data.error ?? 'Save failed', 'error');
      }
    } catch (err) {
      showToast('Network error', 'error');
    } finally {
      btn.disabled = false;
    }
  }

  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type}`;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Init & auto-refresh
  loadDashboard();
  setInterval(loadDashboard, 30000);
</script>
</body>
</html>

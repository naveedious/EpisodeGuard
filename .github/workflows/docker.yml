name: Build and Push Docker Image
on:
  push:
    branches: [ "main" ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Pre-Build Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'          # CRITICAL: Fails the pipeline if severe bugs match criteria
          ignore-unfixed: true    # CRITICAL: Excludes flaws that don't have a vendor patch yet
          trivyignores: './.trivyignore'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        # 👈 CHANGED: Uploads if Trivy passes OR if it fails due to finding bugs.
        # It skips uploading only if the scan itself completely crashes.
        if: success() || failure() 
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get build tag
        id: date
        run: echo "tag=$(date +'%Y%m%d').${{ github.run_number }}" >> $GITHUB_OUTPUT

      # This build step is now fully protected and will be skipped if Trivy exits with code 1
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/episodeguard:latest
            ghcr.io/${{ github.repository_owner }}/episodeguard:${{ steps.date.outputs.tag }}
          build-args: |
            BUILD_DATE=${{ steps.date.outputs.tag }}
            VERSION=${{ steps.date.outputs.tag }}
            REVISION=${{ github.sha }}

      - name: Delete old package versions (keep last 3)
        uses: actions/delete-package-versions@v5
        with:
          package-name: episodeguard
          package-type: container
          min-versions-to-keep: 3
          ignore-versions: latest

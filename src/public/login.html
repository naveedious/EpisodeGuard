<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episode Guard — Sign In</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <style>
    :root {
      --bg:#0f1117;--surface:#1a1d27;--border:#2a2d3d;--text:#e2e4ed;--muted:#6b7080;
      --accent:#6c63ff;--green:#22c55e;--red:#ef4444;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .login-wrap{width:100%;max-width:380px;padding:24px;}
    .login-header{text-align:center;margin-bottom:32px;}
    .login-header h1{font-size:22px;font-weight:700;letter-spacing:.5px;}
    .login-header h1 span{color:var(--accent);}
    .login-header p{color:var(--muted);font-size:13px;margin-top:6px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;}
    .oidc-providers{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
    .oidc-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s;}
    .oidc-btn:hover{border-color:var(--accent);background:rgba(108,99,255,.08);}
    .oidc-icon{width:18px;height:18px;border-radius:4px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12px;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
    .field{margin-bottom:16px;}
    .field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;}
    .field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;padding:9px 12px;outline:none;transition:border-color .15s;}
    .field input:focus{border-color:var(--accent);}
    .submit-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;}
    .submit-btn:hover{opacity:.85;}.submit-btn:disabled{opacity:.4;cursor:default;}
    .error-msg{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;}
    .error-msg.visible{display:block;}
    .local-toggle{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;margin-top:16px;text-align:center;width:100%;text-decoration:underline;}
    .local-toggle:hover{color:var(--text);}
    .local-form{display:none;}
    .local-form.visible{display:block;}
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-header">
    <h1>Episode<span>Guard</span></h1>
    <p>Sign in to continue</p>
  </div>

  <div class="card">
    <div id="errorMsg" class="error-msg"></div>

    <!-- OIDC provider buttons -->
    <div id="oidcProviders" class="oidc-providers"></div>

    <!-- Local login form -->
    <div id="localForm" class="local-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="admin">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <button id="submitBtn" class="submit-btn">Sign In</button>
    </div>

    <button id="localToggle" class="local-toggle" style="display:none">Sign in with local account</button>
  </div>
</div>

<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const errorMap = {
    not_allowed:         'Your account is not authorised to access Episode Guard.',
    provider_unavailable:'The authentication provider is unavailable. Try local login.',
    oidc_error:          'Authentication failed. Try again or use local login.',
    invalid_state:       'Authentication state mismatch. Please try again.',
    session_error:       'Session error. Please try again.',
  };
  if (params.get('error')) showError(errorMap[params.get('error')] ?? 'An error occurred. Please try again.');

  const res = await fetch('/auth/providers');
  const { providers, hasLocal } = await res.json();

  const oidcEl = document.getElementById('oidcProviders');
  const localForm = document.getElementById('localForm');
  const localToggle = document.getElementById('localToggle');

  if (providers.length > 0) {
    for (const p of providers) {
      const a = document.createElement('a');
      a.className = 'oidc-btn';
      a.href = `/auth/oidc/${p.id}`;
      a.innerHTML = `<span class="oidc-icon">${p.name[0].toUpperCase()}</span> Sign in with ${p.name}`;
      oidcEl.appendChild(a);
    }
    if (hasLocal) {
      localToggle.style.display = 'block';
      localToggle.addEventListener('click', () => {
        localForm.classList.toggle('visible');
        localToggle.textContent = localForm.classList.contains('visible')
          ? 'Hide local login'
          : 'Sign in with local account';
      });
    }
  } else {
    // No OIDC — show local form directly, hide toggle
    localForm.classList.add('visible');
  }

  // Local login submission
  document.getElementById('submitBtn').addEventListener('click', doLocalLogin);
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLocalLogin(); });

  async function doLocalLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) return showError('Enter username and password.');

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      const r = await fetch('/auth/local', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (r.ok) {
        location.href = params.get('next') ?? '/';
      } else {
        const j = await r.json().catch(() => ({}));
        showError(j.error ?? 'Invalid credentials.');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    } catch {
      showError('Network error. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }
})();
</script>
</body>
</html>
